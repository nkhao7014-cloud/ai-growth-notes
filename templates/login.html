<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AI Growth Notes</title><style>body{margin:0;font-family:system-ui;background:#f2f5f3;color:#17352b;display:grid;place-items:center;min-height:100vh}.card{width:min(88vw,380px);background:white;padding:32px;border-radius:20px;box-shadow:0 16px 40px #17352b22}h1{font-size:1.6rem}label{display:block;margin-top:18px;font-weight:650}input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #bdcbc5;border-radius:10px}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:10px;background:#176b4d;color:white;font-weight:700}.error{color:#a52626;background:#fff0f0;padding:10px;border-radius:8px}</style></head><body><main class="card"><p>Personal Learning Workspace</p><h1>AI Growth Notes</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}"><label for="username">ユーザー名</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">ログイン</button></form></main></body></html>
