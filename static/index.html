<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI Growth Notes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
      color: #0f172a;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .date {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #475569;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .search-box {
      margin-bottom: 24px;
    }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      padding: 6px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #dbeafe;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.06);
    }

    .view-tab { margin: 0; padding: 12px 18px; background: transparent; color: #64748b; box-shadow: none; }
    .view-tab.active { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #ffffff; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20); }
    .export-button { width: auto; margin: 0 0 24px; padding: 12px 18px; }
    .view[hidden] { display: none; }

    .dashboard {
      margin-bottom: 30px;
    }

    .dashboard-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-card {
      padding: 18px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #dbeafe;
      border-radius: 18px;
    }

    .stat-value {
      color: #2563eb;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat-label {
      margin-top: 5px;
      color: #64748b;
      font-size: 14px;
    }

    .top-tags-label {
      margin-bottom: 10px;
      color: #475569;
      font-size: 14px;
      font-weight: 800;
    }

    .top-tags-empty {
      color: #94a3b8;
      font-size: 14px;
    }

    .top-tag-count {
      margin-left: 5px;
      opacity: 0.75;
    }

    .search-box input {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.06);
    }

    .search-box input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    .filter-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -8px 0 24px;
      padding: 14px 18px;
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      color: #475569;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.06);
    }

    .filter-bar.active { display: flex; }

    .current-filter {
      color: #2563eb;
      font-weight: 800;
    }

    .clear-filter {
      width: auto;
      margin: 0;
      padding: 9px 14px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
    }

    .panel {
      background: rgba(255,255,255,0.9);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10);
      margin-bottom: 30px;
    }

    .input-title,
    .notes-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 18px;
      outline: none;
      resize: vertical;
      font-size: 16px;
      line-height: 1.8;
      color: #0f172a;
      background: #f8fafc;
    }

    textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }

    .note-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .note-date {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .section-label {
      font-weight: 800;
      color: #1e40af;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .raw,
    .ai {
      white-space: pre-wrap;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
    }

    .raw {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .ai {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 5px solid #2563eb;
    }

    .tags {
      margin: 10px 0 16px;
    }

    .tag {
      display: inline-block;
      width: auto;
      padding: 6px 12px;
      margin-top: 0;
      margin-right: 8px;
      margin-bottom: 8px;
      border: none;
      background: #dbeafe;
      color: #2563eb;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .note-header, .note-actions {
      display: flex;
      align-items: center;
    }

    .note-header { justify-content: space-between; gap: 12px; }
    .note-actions { gap: 8px; }

    .note-action {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
      font-weight: 700;
    }

    .favorite-button { font-size: 20px; padding: 5px 10px; color: #94a3b8; }
    .favorite-button.active { color: #f59e0b; background: #fffbeb; border-color: #fde68a; }
    .delete-button { color: #dc2626; background: #fff7f7; border-color: #fecaca; }
    .edit-area { min-height: 130px; margin-top: 12px; }
    .edit-actions { display: flex; gap: 10px; }
    .edit-actions button { margin-top: 10px; }
    .cancel-button { background: #64748b; }

    button.tag:hover,
    button.tag.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20);
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: #64748b;
      background: #ffffff;
      border-radius: 20px;
      border: 1px dashed #cbd5e1;
    }

    .timeline-heading { font-size: 24px; font-weight: 800; color: #1e40af; margin-bottom: 8px; }
    .timeline-description { color: #64748b; margin-bottom: 22px; }
    .timeline-group { margin-bottom: 16px; overflow: hidden; background: #ffffff; border: 1px solid #dbeafe; border-radius: 18px; }
    .timeline-date { display: flex; align-items: center; justify-content: space-between; width: 100%; margin: 0; padding: 17px 20px; border-radius: 0; background: #eff6ff; color: #1e40af; box-shadow: none; text-align: left; }
    .timeline-date:hover { transform: none; box-shadow: none; background: #dbeafe; }
    .timeline-count { color: #64748b; font-size: 13px; }
    .timeline-chevron { display: inline-block; transition: transform 0.2s; }
    .timeline-group.collapsed .timeline-chevron { transform: rotate(-90deg); }
    .timeline-group.collapsed .timeline-items { display: none; }
    .timeline-items { padding: 4px 20px; }
    .timeline-item { position: relative; padding: 18px 0 18px 22px; border-bottom: 1px solid #e2e8f0; }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-item::before { content: ""; position: absolute; left: 0; top: 26px; width: 9px; height: 9px; border-radius: 50%; background: #2563eb; box-shadow: 0 0 0 4px #dbeafe; }
    .timeline-time { color: #64748b; font-size: 13px; margin-bottom: 5px; }
    .timeline-note-text { line-height: 1.7; white-space: pre-wrap; }

    .weekly-report-button { margin: 0 0 20px; }
    .weekly-report-card { display: none; margin-bottom: 30px; }
    .weekly-report-card.active { display: block; }
    .weekly-report-header { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 18px; }
    .weekly-report-title { color: #1e40af; font-size: 22px; font-weight: 800; }
    .weekly-report-period { color: #64748b; font-size: 13px; }
    .weekly-report-section { padding: 16px 0; border-top: 1px solid #e2e8f0; }
    .weekly-report-section h3 { margin: 0 0 10px; color: #334155; font-size: 16px; }
    .weekly-report-section ul { margin: 0; padding-left: 22px; line-height: 1.8; }
    .weekly-report-summary { margin: 0; line-height: 1.8; white-space: pre-wrap; }
    .weekly-report-meta { margin-top: 14px; color: #94a3b8; font-size: 12px; }

    @media (max-width: 600px) {
      .logo { font-size: 34px; }
      .container { padding-top: 32px; }
      .panel { padding: 20px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">🌱 AI Growth Notes</div>
      <div class="subtitle">毎日の小さな成長を記録し、未来の一冊へ</div>
      <div class="date" id="todayDate"></div>
    </div>

    <div class="view-tabs" role="tablist" aria-label="表示切替">
      <button type="button" class="view-tab active" id="dashboardTab" role="tab" aria-selected="true" onclick="showView('dashboard')">Dashboard</button>
      <button type="button" class="view-tab" id="timelineTab" role="tab" aria-selected="false" onclick="showView('timeline')">Timeline</button>
    </div>

    <button type="button" class="export-button" onclick="exportMarkdown()">Markdown Export</button>

    <main class="view" id="dashboardView">

    <div class="panel dashboard">
      <div class="dashboard-title">成長ダッシュボード</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalNotes">-</div>
          <div class="stat-label">総ノート数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="todayNotes">-</div>
          <div class="stat-label">本日のノート数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="tagCount">-</div>
          <div class="stat-label">タグ数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="favoriteNotes">-</div>
          <div class="stat-label">お気に入り</div>
        </div>
      </div>
      <div class="top-tags-label">よく使われているタグ Top 5</div>
      <div id="topTags"><span class="top-tags-empty">集計中...</span></div>
    </div>

    <button type="button" class="weekly-report-button" id="weeklyReportButton" onclick="loadWeeklyReport()">Weekly Report</button>
    <section class="panel weekly-report-card" id="weeklyReportCard" aria-live="polite"></section>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="🔍 成長記録を検索（例：FastAPI / Prompt / AI）"
        oninput="searchNotes()"
      />
    </div>

    <div class="filter-bar" id="filterBar">
      <div>現在のフィルター：<span class="current-filter" id="currentFilter"></span></div>
      <button type="button" class="clear-filter" onclick="clearTagFilter()">フィルターを解除</button>
    </div>

    <div class="panel">
      <div class="input-title">📚 今日は何を学びましたか？</div>
      <textarea
        id="noteInput"
        placeholder="例：今日は FastAPI を学び、API とフロントエンド画面の関係を理解しました。また、プロダクトは最小構成から作り始められると気づきました。"
      ></textarea>
      <button onclick="saveNote()">✨ 保存して AI で整理</button>
    </div>

    <div class="notes-title">📖 私の成長記録</div>
    <div id="notesList"></div>
    </main>

    <section class="view panel" id="timelineView" hidden>
      <div class="timeline-heading">Timeline</div>
      <div class="timeline-description">日々の成長記録を時系列で振り返ります。</div>
      <div id="timelineList"></div>
    </section>
  </div>

  <script>
    let currentTag = "";
    let timelineLoaded = false;

    async function exportMarkdown() {
      const button = document.querySelector(".export-button");
      button.disabled = true;
      try {
        const response = await fetch("/api/export/markdown");
        if (!response.ok) throw new Error("Export failed");
        const disposition = response.headers.get("Content-Disposition") || "";
        const filename = disposition.match(/filename="?([^";]+)"?/i)?.[1] || "ai-growth-notes.md";
        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (error) {
        alert("Markdown のエクスポートに失敗しました。");
      } finally {
        button.disabled = false;
      }
    }

    function showView(view) {
      const isTimeline = view === "timeline";
      document.getElementById("dashboardView").hidden = isTimeline;
      document.getElementById("timelineView").hidden = !isTimeline;
      document.getElementById("dashboardTab").classList.toggle("active", !isTimeline);
      document.getElementById("timelineTab").classList.toggle("active", isTimeline);
      document.getElementById("dashboardTab").setAttribute("aria-selected", String(!isTimeline));
      document.getElementById("timelineTab").setAttribute("aria-selected", String(isTimeline));
      if (isTimeline && !timelineLoaded) loadTimeline();
    }

    async function loadTimeline() {
      const list = document.getElementById("timelineList");
      list.innerHTML = '<div class="empty">読み込み中...</div>';
      const res = await fetch("/api/timeline");
      if (!res.ok) {
        list.innerHTML = '<div class="empty">Timeline の読み込みに失敗しました。</div>';
        return;
      }
      const groups = await res.json();
      timelineLoaded = true;
      if (groups.length === 0) {
        list.innerHTML = '<div class="empty">まだ成長記録がありません。</div>';
        return;
      }
      list.innerHTML = groups.map(group => `
        <section class="timeline-group">
          <button type="button" class="timeline-date" aria-expanded="true">
            <span>${escapeHtml(group.label)}</span>
            <span><span class="timeline-count">${group.notes.length}件</span> <span class="timeline-chevron">▼</span></span>
          </button>
          <div class="timeline-items">
            ${group.notes.map(note => `
              <article class="timeline-item">
                <div class="timeline-time">${escapeHtml(formatTimelineTime(note.created_at))}</div>
                <div class="timeline-note-text">${escapeHtml(note.raw_text)}</div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function formatTimelineTime(createdAt) {
      const parts = String(createdAt || "").split(" ");
      return parts.length > 1 ? parts[1].slice(0, 5) : "";
    }
    function setTodayDate() {
      const now = new Date();
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];

      const text =
        "📅 " +
        now.getFullYear() + "年" +
        (now.getMonth() + 1) + "月" +
        now.getDate() + "日 " +
        weekdays[now.getDay()];

      document.getElementById("todayDate").innerText = text;
    }

    async function saveNote() {
      const text = document.getElementById("noteInput").value.trim();

      if (!text) {
        alert("内容を入力してください");
        return;
      }

      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      document.getElementById("noteInput").value = "";
      document.getElementById("searchInput").value = "";
      currentTag = "";
      updateFilterDisplay();
      await Promise.all([loadNotes(), loadStats()]);
      timelineLoaded = false;
    }

    async function loadStats() {
      const res = await fetch("/api/stats");
      if (!res.ok) return;

      const stats = await res.json();
      document.getElementById("totalNotes").textContent = stats.total_notes;
      document.getElementById("todayNotes").textContent = stats.today_notes;
      document.getElementById("tagCount").textContent = stats.tag_count;
      document.getElementById("favoriteNotes").textContent = stats.favorite_notes;

      const topTags = document.getElementById("topTags");
      if (stats.top_tags.length === 0) {
        topTags.innerHTML = '<span class="top-tags-empty">タグはまだありません</span>';
        return;
      }

      topTags.innerHTML = stats.top_tags.map(item => `
        <button type="button" class="tag" data-tag="${escapeHtml(item.tag)}">
          #${escapeHtml(item.tag)}<span class="top-tag-count">${item.count}</span>
        </button>
      `).join("");
    }

    async function loadWeeklyReport() {
      const button = document.getElementById("weeklyReportButton");
      const card = document.getElementById("weeklyReportCard");
      button.disabled = true;
      card.classList.add("active");
      card.innerHTML = '<div class="empty">Weekly Report を生成中...</div>';

      try {
        const response = await fetch("/api/report/weekly");
        if (!response.ok) throw new Error("Weekly report failed");
        const report = await response.json();
        const learned = report.learned_contents.length
          ? report.learned_contents.map(item => `<li>${escapeHtml(item)}</li>`).join("")
          : "<li>今週の学習記録はまだありません。</li>";
        const tags = report.frequent_tags.length
          ? report.frequent_tags.map(item => `<span class="tag">#${escapeHtml(item.tag)} <span class="top-tag-count">${item.count}</span></span>`).join("")
          : '<span class="top-tags-empty">タグはまだありません</span>';
        const suggestions = report.next_week_suggestions
          .map(item => `<li>${escapeHtml(item)}</li>`).join("");

        card.innerHTML = `
          <div class="weekly-report-header">
            <div class="weekly-report-title">Weekly Report</div>
            <div class="weekly-report-period">${escapeHtml(report.period.start)} 〜 ${escapeHtml(report.period.end)}</div>
          </div>
          <div class="weekly-report-section"><h3>今週学習した内容</h3><ul>${learned}</ul></div>
          <div class="weekly-report-section"><h3>頻出タグ</h3><div>${tags}</div></div>
          <div class="weekly-report-section"><h3>AIによる総括</h3><p class="weekly-report-summary">${escapeHtml(report.ai_summary)}</p></div>
          <div class="weekly-report-section"><h3>来週の学習提案</h3><ul>${suggestions}</ul></div>
          <div class="weekly-report-meta">${report.note_count}件の記録を集計 / ${escapeHtml(report.provider)}</div>
        `;
      } catch (error) {
        card.innerHTML = '<div class="empty">Weekly Report の生成に失敗しました。</div>';
      } finally {
        button.disabled = false;
      }
    }

    async function loadNotes() {
      const params = new URLSearchParams();
      if (currentTag) params.set("tag", currentTag);

      const query = params.toString();
      const res = await fetch(query ? `/api/notes?${query}` : "/api/notes");
      const notes = await res.json();

      renderNotes(notes);
    }

    async function searchNotes() {
      const keyword = document.getElementById("searchInput").value.trim();
      const params = new URLSearchParams();
      if (keyword) params.set("q", keyword);
      if (currentTag) params.set("tag", currentTag);

      const url = keyword
        ? `/api/search?${params.toString()}`
        : (params.toString() ? `/api/notes?${params.toString()}` : "/api/notes");

      const res = await fetch(url);
      const notes = await res.json();

      renderNotes(notes);
    }

    function selectTag(tag) {
      currentTag = tag;
      updateFilterDisplay();
      searchNotes();
    }

    function clearTagFilter() {
      currentTag = "";
      updateFilterDisplay();
      searchNotes();
    }

    function updateFilterDisplay() {
      const filterBar = document.getElementById("filterBar");
      document.getElementById("currentFilter").textContent = currentTag ? `#${currentTag}` : "";
      filterBar.classList.toggle("active", Boolean(currentTag));
    }

    function renderNotes(notes) {
      const notesList = document.getElementById("notesList");
      notesList.innerHTML = "";

      if (notes.length === 0) {
        notesList.innerHTML = `<div class="empty">該当する成長記録が見つかりませんでした。</div>`;
        return;
      }

      notes.forEach(note => {
        const card = document.createElement("div");
        card.className = "note-card";

        const tagsHtml = note.tags && note.tags.length > 0
          ? note.tags.map(tag => `
              <button
                type="button"
                class="tag${tag.toLocaleLowerCase() === currentTag.toLocaleLowerCase() ? " active" : ""}"
                data-tag="${escapeHtml(tag)}"
              >#${escapeHtml(tag)}</button>
            `).join("")
          : `<span class="tag">#未分類</span>`;

        card.dataset.noteId = note.id;
        card.innerHTML = `
          <div class="note-header">
            <div class="note-date">📅 ${note.created_at}</div>
            <div class="note-actions">
              <button type="button" class="note-action favorite-button${note.is_favorite ? " active" : ""}" data-action="favorite" aria-label="お気に入りを切り替え">★</button>
              <button type="button" class="note-action" data-action="edit">編集</button>
              <button type="button" class="note-action delete-button" data-action="delete">削除</button>
            </div>
          </div>

          <div class="section-label">📝 元のノート</div>
          <div class="raw">${escapeHtml(note.raw_text)}</div>

          <div class="section-label">🏷 タグ</div>
          <div class="tags">${tagsHtml}</div>

          <div class="section-label">🤖 AI による自動整理</div>
          <div class="ai">${escapeHtml(note.ai_summary)}</div>
        `;

        notesList.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function toggleFavorite(card) {
      const button = card.querySelector('[data-action="favorite"]');
      const isFavorite = !button.classList.contains("active");
      const res = await fetch(`/api/notes/${card.dataset.noteId}/favorite`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_favorite: isFavorite })
      });
      if (!res.ok) return alert("お気に入りの更新に失敗しました。");
      button.classList.toggle("active", isFavorite);
      await loadStats();
    }

    function startEdit(card) {
      if (card.querySelector(".edit-area")) return;
      const raw = card.querySelector(".raw");
      raw.hidden = true;
      raw.insertAdjacentHTML("afterend", `
        <textarea class="edit-area">${escapeHtml(raw.textContent)}</textarea>
        <div class="edit-actions">
          <button type="button" data-action="save-edit">保存してAI整理を再実行</button>
          <button type="button" class="cancel-button" data-action="cancel-edit">キャンセル</button>
        </div>`);
    }

    function cancelEdit(card) {
      card.querySelector(".raw").hidden = false;
      card.querySelector(".edit-area")?.remove();
      card.querySelector(".edit-actions")?.remove();
    }

    async function saveEdit(card) {
      const text = card.querySelector(".edit-area").value.trim();
      if (!text) return alert("内容を入力してください。");
      const res = await fetch(`/api/notes/${card.dataset.noteId}`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!res.ok) return alert("ノートの更新に失敗しました。");
      await Promise.all([searchNotes(), loadStats()]);
      timelineLoaded = false;
    }

    async function deleteNote(card) {
      if (!confirm("このノートを削除しますか？この操作は取り消せません。")) return;
      const res = await fetch(`/api/notes/${card.dataset.noteId}`, { method: "DELETE" });
      if (!res.ok) return alert("ノートの削除に失敗しました。");
      await Promise.all([searchNotes(), loadStats()]);
      timelineLoaded = false;
    }

    document.getElementById("notesList").addEventListener("click", event => {
      const actionButton = event.target.closest("button[data-action]");
      if (actionButton) {
        const card = actionButton.closest(".note-card");
        const actions = { favorite: toggleFavorite, edit: startEdit,
          "cancel-edit": cancelEdit, "save-edit": saveEdit, delete: deleteNote };
        actions[actionButton.dataset.action]?.(card);
        return;
      }
      const tagButton = event.target.closest("button.tag[data-tag]");
      if (tagButton) selectTag(tagButton.dataset.tag);
    });

    document.getElementById("topTags").addEventListener("click", event => {
      const tagButton = event.target.closest("button.tag[data-tag]");
      if (tagButton) selectTag(tagButton.dataset.tag);
    });

    document.getElementById("timelineList").addEventListener("click", event => {
      const button = event.target.closest(".timeline-date");
      if (!button) return;
      const group = button.closest(".timeline-group");
      const collapsed = group.classList.toggle("collapsed");
      button.setAttribute("aria-expanded", String(!collapsed));
    });

    setTodayDate();
    updateFilterDisplay();
    Promise.all([loadNotes(), loadStats()]);
  </script>
</body>
</html>
