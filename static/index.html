<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>AI Growth Notes</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
      color: #0f172a;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .date {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      color: #475569;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .search-box {
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.06);
    }

    .search-box input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    .filter-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -8px 0 24px;
      padding: 14px 18px;
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      color: #475569;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.06);
    }

    .filter-bar.active { display: flex; }

    .current-filter {
      color: #2563eb;
      font-weight: 800;
    }

    .clear-filter {
      width: auto;
      margin: 0;
      padding: 9px 14px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
    }

    .panel {
      background: rgba(255,255,255,0.9);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10);
      margin-bottom: 30px;
    }

    .input-title,
    .notes-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e40af;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 18px;
      outline: none;
      resize: vertical;
      font-size: 16px;
      line-height: 1.8;
      color: #0f172a;
      background: #f8fafc;
    }

    textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }

    .note-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.06);
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .note-date {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .section-label {
      font-weight: 800;
      color: #1e40af;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .raw,
    .ai {
      white-space: pre-wrap;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
    }

    .raw {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .ai {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 5px solid #2563eb;
    }

    .tags {
      margin: 10px 0 16px;
    }

    .tag {
      display: inline-block;
      width: auto;
      padding: 6px 12px;
      margin-top: 0;
      margin-right: 8px;
      margin-bottom: 8px;
      border: none;
      background: #dbeafe;
      color: #2563eb;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    button.tag:hover,
    button.tag.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20);
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: #64748b;
      background: #ffffff;
      border-radius: 20px;
      border: 1px dashed #cbd5e1;
    }

    @media (max-width: 600px) {
      .logo { font-size: 34px; }
      .container { padding-top: 32px; }
      .panel { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">🌱 AI Growth Notes</div>
      <div class="subtitle">毎日の小さな成長を記録し、未来の一冊へ</div>
      <div class="date" id="todayDate"></div>
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="🔍 成長記録を検索（例：FastAPI / Prompt / AI）"
        oninput="searchNotes()"
      />
    </div>

    <div class="filter-bar" id="filterBar">
      <div>現在のフィルター：<span class="current-filter" id="currentFilter"></span></div>
      <button type="button" class="clear-filter" onclick="clearTagFilter()">フィルターを解除</button>
    </div>

    <div class="panel">
      <div class="input-title">📚 今日は何を学びましたか？</div>
      <textarea
        id="noteInput"
        placeholder="例：今日は FastAPI を学び、API とフロントエンド画面の関係を理解しました。また、プロダクトは最小構成から作り始められると気づきました。"
      ></textarea>
      <button onclick="saveNote()">✨ 保存して AI で整理</button>
    </div>

    <div class="notes-title">📖 私の成長記録</div>
    <div id="notesList"></div>
  </div>

  <script>
    let currentTag = "";
    function setTodayDate() {
      const now = new Date();
      const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];

      const text =
        "📅 " +
        now.getFullYear() + "年" +
        (now.getMonth() + 1) + "月" +
        now.getDate() + "日 " +
        weekdays[now.getDay()];

      document.getElementById("todayDate").innerText = text;
    }

    async function saveNote() {
      const text = document.getElementById("noteInput").value.trim();

      if (!text) {
        alert("内容を入力してください");
        return;
      }

      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      document.getElementById("noteInput").value = "";
      document.getElementById("searchInput").value = "";
      currentTag = "";
      updateFilterDisplay();
      loadNotes();
    }

    async function loadNotes() {
      const params = new URLSearchParams();
      if (currentTag) params.set("tag", currentTag);

      const query = params.toString();
      const res = await fetch(query ? `/api/notes?${query}` : "/api/notes");
      const notes = await res.json();

      renderNotes(notes);
    }

    async function searchNotes() {
      const keyword = document.getElementById("searchInput").value.trim();
      const params = new URLSearchParams();
      if (keyword) params.set("q", keyword);
      if (currentTag) params.set("tag", currentTag);

      const url = keyword
        ? `/api/search?${params.toString()}`
        : (params.toString() ? `/api/notes?${params.toString()}` : "/api/notes");

      const res = await fetch(url);
      const notes = await res.json();

      renderNotes(notes);
    }

    function selectTag(tag) {
      currentTag = tag;
      updateFilterDisplay();
      searchNotes();
    }

    function clearTagFilter() {
      currentTag = "";
      updateFilterDisplay();
      searchNotes();
    }

    function updateFilterDisplay() {
      const filterBar = document.getElementById("filterBar");
      document.getElementById("currentFilter").textContent = currentTag ? `#${currentTag}` : "";
      filterBar.classList.toggle("active", Boolean(currentTag));
    }

    function renderNotes(notes) {
      const notesList = document.getElementById("notesList");
      notesList.innerHTML = "";

      if (notes.length === 0) {
        notesList.innerHTML = `<div class="empty">該当する成長記録が見つかりませんでした。</div>`;
        return;
      }

      notes.forEach(note => {
        const card = document.createElement("div");
        card.className = "note-card";

        const tagsHtml = note.tags && note.tags.length > 0
          ? note.tags.map(tag => `
              <button
                type="button"
                class="tag${tag.toLocaleLowerCase() === currentTag.toLocaleLowerCase() ? " active" : ""}"
                data-tag="${escapeHtml(tag)}"
              >#${escapeHtml(tag)}</button>
            `).join("")
          : `<span class="tag">#未分類</span>`;

        card.innerHTML = `
          <div class="note-date">📅 ${note.created_at}</div>

          <div class="section-label">📝 元のノート</div>
          <div class="raw">${escapeHtml(note.raw_text)}</div>

          <div class="section-label">🏷 タグ</div>
          <div class="tags">${tagsHtml}</div>

          <div class="section-label">🤖 AI による自動整理</div>
          <div class="ai">${escapeHtml(note.ai_summary)}</div>
        `;

        notesList.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("notesList").addEventListener("click", event => {
      const tagButton = event.target.closest("button.tag[data-tag]");
      if (tagButton) selectTag(tagButton.dataset.tag);
    });

    setTodayDate();
    updateFilterDisplay();
    loadNotes();
  </script>
</body>
</html>
