<div class="ai-daily-page" aria-live="polite">
  <header class="card ai-daily-header">
    <div><div class="eyebrow">Daily Briefing</div><h1>AI Daily</h1><p>AIの公式情報を、学習と実践につながる形で短時間に確認できます。</p></div>
    <div class="ai-daily-meta"><strong id="aiDailyDate"></strong><time id="aiDailyUpdated">未更新</time><button class="primary action-button ai-daily-refresh" id="aiDailyRefresh" type="button">更新する</button></div>
  </header>
  <div id="aiDailyFeedback" class="ai-daily-feedback" role="status" hidden></div>
  <section id="aiDailyLoading" class="card app-card ai-state"><p>AI Dailyを読み込んでいます…</p></section>
  <section id="aiDailyError" class="card app-card ai-state ai-state-error" hidden><h2>AI Dailyを表示できませんでした。</h2><p>しばらくしてから再度お試しください。</p><button class="primary action-button" type="button" data-retry>再読み込み</button></section>
  <section id="aiDailyEmpty" class="card app-card ai-state" hidden><h2>本日のAI Dailyはまだ作成されていません。</h2><p>公式フィードから最新情報を取得してください。</p><button class="primary action-button" type="button" data-refresh>更新する</button></section>
  <div id="aiDailyContent" hidden>
    <section class="card app-card" aria-labelledby="highlightsTitle"><div class="ai-section-heading"><div><div class="eyebrow">Top Stories</div><h2 id="highlightsTitle">Today's Highlights</h2><p>今日押さえておきたい公式情報</p></div><span class="ai-count" id="aiHighlightCount"></span></div><div class="ai-highlight-grid" id="aiHighlights"></div></section>
    <div class="ai-focus-grid"><section class="card app-card ai-focus-card" id="aiLearning"></section><section class="card app-card ai-focus-card" id="aiPractice"></section></div>
    <section class="card app-card" aria-labelledby="readingTitle"><div class="ai-section-heading"><div><div class="eyebrow">Later Today</div><h2 id="readingTitle">Reading List</h2><p>あとで読みたい記事を状態別に確認できます。</p></div><span class="ai-count" id="aiReadingCount"></span></div><div class="ai-reading-filters" role="group" aria-label="Reading Listフィルター"><button class="action active" type="button" data-filter="all">すべて</button><button class="action" type="button" data-filter="unread">未読</button><button class="action" type="button" data-filter="favorite">お気に入り</button></div><div id="aiReadingList" class="ai-reading-list"></div></section>
  </div>
</div>
